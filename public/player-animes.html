    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draksyon - Player</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        html,body{height:100%}
        body{
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
            background:#0d0d0f;
            color:#fff;
            -webkit-font-smoothing:antialiased;
            overflow-y:auto;
            padding-top:56px;
            padding-bottom:20px;
        }
        ::-webkit-scrollbar{width:5px;height:6px}
        ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.06);border-radius:999px}
        ::-webkit-scrollbar-track{background:transparent}

        /* ── Header ── */
        .otk-header-fixed{
            position:fixed;top:0;left:0;right:0;height:56px;
            display:flex;align-items:center;justify-content:space-between;
            padding:0 14px;
            background:rgba(13,13,15,0.92);
            backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
            border-bottom:1px solid rgba(255,255,255,0.04);
            z-index:100;
        }
        .header-inner{
            width:100%;max-width:1200px;margin:0 auto;
            display:flex;align-items:center;gap:10px;
        }
        .icon-btn{background:transparent;border:none;color:#fff;cursor:pointer;padding:6px;display:flex;align-items:center;justify-content:center;transition:opacity .3s}
        .icon-btn:hover{opacity:.7}
        .header-title-text{
            flex:1;font-size:14px;color:#9aa0a6;
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
            text-align:center;
        }
        .server-indicator{font-size:10px;color:#5B7FFF;font-weight:700;padding:3px 8px;border-radius:6px;background:rgba(37,75,255,0.1);border:1px solid rgba(37,75,255,0.2);white-space:nowrap;flex-shrink:0}

        /* ── Drawer ── */
        .drawer-overlay{
            position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:150;
            opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s;
            backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
        }
        .drawer-overlay.open{opacity:1;visibility:visible}
        .drawer{
            position:fixed;top:0;left:0;bottom:0;width:270px;max-width:80vw;
            background:#111113;z-index:200;
            transform:translateX(-100%);
            transition:transform .35s cubic-bezier(.4,0,.2,1);
            display:flex;flex-direction:column;
            border-right:1px solid rgba(255,255,255,0.06);
            overflow-y:auto;
        }
        .drawer.open{transform:translateX(0)}
        .drawer-top{
            padding:20px 16px 14px;
            display:flex;align-items:center;justify-content:space-between;
            border-bottom:1px solid rgba(255,255,255,0.06);
        }
        .drawer-brand-row{display:flex;align-items:center;gap:10px}
        .drawer-brand-logo{
            width:34px;height:34px;border-radius:8px;
            background:linear-gradient(135deg,#254BFF,#3A56F6);
            display:flex;align-items:center;justify-content:center;
            box-shadow:0 3px 10px rgba(37,75,255,0.3);overflow:hidden;
        }
        .drawer-brand-logo img{width:100%;height:100%;object-fit:cover;border-radius:8px}
        .drawer-brand-title{font-size:15px;font-weight:700;color:#fff;letter-spacing:.5px}
        .drawer-close-btn{background:none;border:none;color:#666;width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:color .2s}
        .drawer-close-btn:hover{color:#fff}
        .drawer-nav{list-style:none;padding:8px 8px 0}
        .drawer-nav-item{
            display:flex;align-items:center;gap:12px;
            padding:11px 12px;border-radius:8px;cursor:pointer;
            color:#888;font-size:14px;font-weight:500;
            transition:all .2s;border:none;background:none;width:100%;text-align:left;text-decoration:none;
        }
        .drawer-nav-item:hover{background:rgba(255,255,255,0.04);color:#ccc}
        .drawer-nav-item svg{width:18px;height:18px;flex-shrink:0;opacity:.6}
        .drawer-divider{height:1px;background:rgba(255,255,255,0.05);margin:6px 16px}
        .drawer-section-label{padding:10px 16px 4px;font-size:11px;font-weight:700;color:#555;letter-spacing:1px;text-transform:uppercase}
        .server-option{
            display:flex;align-items:center;gap:12px;
            padding:10px 12px;border-radius:8px;cursor:pointer;
            color:#888;font-size:13px;font-weight:500;
            transition:all .2s;border:none;background:none;width:100%;text-align:left;
        }
        .server-option:hover{background:rgba(255,255,255,0.04);color:#ccc}
        .server-option.active{background:rgba(37,75,255,0.12);color:#fff}
        .server-radio{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:border-color .2s}
        .server-option.active .server-radio{border-color:#254BFF}
        .server-radio-dot{width:8px;height:8px;border-radius:50%;background:#254BFF;display:none}
        .server-option.active .server-radio-dot{display:block}
        .server-name{flex:1}
        .server-badge{font-size:10px;padding:2px 7px;border-radius:4px;background:rgba(37,75,255,0.15);color:#5B7FFF;font-weight:600}
        .drawer-footer{margin-top:auto;padding:14px 16px;border-top:1px solid rgba(255,255,255,0.05);display:flex;align-items:center;gap:10px}
        .drawer-avatar{width:35px;height:35px;border-radius:50%;background:#1a1a1e;background-size:cover;background-position:center;flex-shrink:0}
        .drawer-user-info{display:flex;flex-direction:column;gap:1px;flex:1}
        .drawer-user-name{font-size:14px;font-weight:600;color:#ddd}
        .drawer-user-role{font-size:11px;color:#555}

        /* ── Info Card (contains player + buttons) ── */
        .info-card{
            margin:14px;
            padding:0;
            background:rgba(255,255,255,0.03);
            border:1px solid rgba(255,255,255,0.06);
            border-radius:16px;
            overflow:hidden;
        }
        .info-card-body{
            padding:18px 18px 22px;
        }
        .info-card-title{
            font-size:17px;font-weight:600;color:#fff;
            line-height:1.4;margin-bottom:10px;
            text-align:center;
        }
        .info-card-desc{
            font-size:13px;color:#9aa0a6;line-height:1.7;
            margin-bottom:18px;
            display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;
        }

        /* ── Video inside card ── */
        .video-wrapper{
            position:relative;width:100%;padding-top:56.25%;
            background:#000;
            border-radius:16px 16px 0 0;
        }
        .video-wrapper video,
        .video-wrapper iframe{
            position:absolute;top:0;left:0;width:100%;height:100%;border:none;
            border-radius:16px 16px 0 0;
        }

        /* ── Buttons ── */
        .action-btn{
            display:flex;align-items:center;justify-content:center;gap:10px;
            width:100%;padding:14px;border-radius:12px;
            font-size:15px;font-weight:600;cursor:pointer;
            transition:all .3s;text-decoration:none;
            margin-bottom:10px;
        }
        .action-btn:last-child{margin-bottom:0}
        .action-btn svg{width:20px;height:20px;flex-shrink:0}
        .btn-episodes{
            background:rgba(255,255,255,0.05);
            border:1px solid rgba(255,255,255,0.1);
            color:#fff;
        }
        .btn-episodes:hover{background:rgba(255,255,255,0.08)}
        .btn-next{
            background:linear-gradient(90deg,#254BFF,#3A56F6);
            border:none;color:#fff;
            box-shadow:0 6px 18px rgba(37,75,255,0.3);
        }
        .btn-next:hover{box-shadow:0 8px 24px rgba(37,75,255,0.5)}
        .btn-next:disabled,.btn-next.disabled{opacity:.35;cursor:not-allowed;pointer-events:none}

        /* ── Quality ── */
        .quality-section{
            margin-top:14px;
        }
        .quality-label{font-size:12px;color:#555;margin-bottom:8px;font-weight:700;letter-spacing:.5px}
        .quality-btns{display:flex;gap:8px;flex-wrap:wrap}
        .quality-btn{
            padding:8px 16px;border-radius:10px;
            background:rgba(255,255,255,0.03);
            border:1px solid rgba(255,255,255,0.06);
            color:#9aa0a6;font-size:12px;font-weight:600;
            cursor:pointer;transition:all .2s;
        }
        .quality-btn:hover{border-color:rgba(37,75,255,0.3);color:#ccc}
        .quality-btn.active{background:rgba(37,75,255,0.12);border-color:rgba(37,75,255,0.35);color:#fff}

        /* ── Episode List Modal ── */
        .ep-modal-overlay{
            position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:300;
            opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;
            display:flex;align-items:flex-end;justify-content:center;
        }
        .ep-modal-overlay.open{opacity:1;visibility:visible}
        .ep-modal{
            width:100%;max-width:500px;max-height:75vh;
            background:#18181b;border-radius:16px 16px 0 0;
            display:flex;flex-direction:column;
            transform:translateY(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);
        }
        .ep-modal-overlay.open .ep-modal{transform:translateY(0)}
        .ep-modal-header{
            padding:16px 18px;display:flex;align-items:center;justify-content:space-between;
            border-bottom:1px solid rgba(255,255,255,0.06);flex-shrink:0;
        }
        .ep-modal-title{font-size:16px;font-weight:600;color:#fff}
        .ep-modal-close{background:none;border:none;color:#666;cursor:pointer;padding:4px;display:flex;align-items:center}
        .ep-modal-close:hover{color:#fff}
        .ep-modal-search{padding:10px 18px;flex-shrink:0}
        .ep-search-input{
            width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);
            padding:10px 14px;border-radius:10px;color:#fff;font-size:14px;outline:none;
        }
        .ep-search-input:focus{border-color:rgba(37,75,255,0.4)}
        .ep-modal-list{flex:1;overflow-y:auto;padding:8px 10px 20px}
        .ep-item{
            display:flex;align-items:center;gap:12px;
            padding:12px 10px;border-radius:10px;
            color:#9aa0a6;font-size:14px;font-weight:500;
            cursor:pointer;transition:all .2s;text-decoration:none;
        }
        .ep-item:hover{background:rgba(255,255,255,0.04);color:#ccc}
        .ep-item.active{background:rgba(37,75,255,0.12);color:#fff}
        .ep-item-num{
            width:32px;height:32px;border-radius:8px;
            background:rgba(255,255,255,0.05);
            display:flex;align-items:center;justify-content:center;
            font-size:12px;font-weight:700;color:#666;flex-shrink:0;
        }
        .ep-item.active .ep-item-num{background:rgba(37,75,255,0.2);color:#5B7FFF}

        /* ── Loading / Error ── */
        .loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50vh;color:#9aa0a6;font-size:15px;gap:12px}
        .spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,0.06);border-top-color:#254BFF;border-radius:50%;animation:spin .8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .content-wrapper{display:none}
        .error-box{
            max-width:400px;margin:40px auto;padding:30px;text-align:center;
            background:rgba(255,50,50,0.05);border:1px solid rgba(255,50,50,0.15);border-radius:16px;
        }
        .error-box h3{font-size:16px;color:#ff5555;margin-bottom:8px}
        .error-box p{font-size:13px;color:#888}

        @media(min-width:768px){
            .info-card{max-width:600px;margin-left:auto;margin-right:auto}
            .info-card-title{font-size:20px}
        }
    </style>
</head>

                    <a class="action-btn btn-next" id="btn-next" href="#">
                        Próximo
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Episode List Modal -->
    <div class="ep-modal-overlay" id="ep-modal-overlay">
        <div class="ep-modal">
            <div class="ep-modal-header">
                <span class="ep-modal-title">Episódios</span>
                <button class="ep-modal-close" id="ep-modal-close">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="ep-modal-search">
                <input class="ep-search-input" id="ep-search" placeholder="Buscar episódio..." />
            </div>
            <div class="ep-modal-list" id="ep-modal-list"></div>
        </div>
    </div>

    <script>
    var API_BASE = 'http://127.0.0.1:3000';
    var LS_SERVER = 'draksyon_server_v1';
    var currentServer = localStorage.getItem(LS_SERVER) || 's1';

    function getApiPrefix() { return currentServer === 's2' ? '/api/s2' : '/api'; }

    var indicator = document.getElementById('server-indicator');
    if (currentServer === 's2') { indicator.textContent = 'S2'; indicator.title = 'Animes Online'; }
    else { indicator.textContent = 'S1'; indicator.title = 'AnimeFire'; }

    document.querySelectorAll('.server-option').forEach(function(btn) {
        btn.classList.toggle('active', btn.dataset.server === currentServer);
        btn.addEventListener('click', function() {
            currentServer = btn.dataset.server;
            localStorage.setItem(LS_SERVER, currentServer);
            location.reload();
        });
    });

    var drawer = document.getElementById('drawer');
    var overlay = document.getElementById('drawer-overlay');
    document.getElementById('open-drawer').addEventListener('click', function() {
        drawer.classList.add('open'); overlay.classList.add('open');
    });
    function closeDrawer() { drawer.classList.remove('open'); overlay.classList.remove('open'); }
    document.getElementById('drawer-close').addEventListener('click', closeDrawer);
    overlay.addEventListener('click', closeDrawer);

    var epOverlay = document.getElementById('ep-modal-overlay');
    document.getElementById('btn-episodes').addEventListener('click', function() { epOverlay.classList.add('open'); });
    document.getElementById('ep-modal-close').addEventListener('click', function() { epOverlay.classList.remove('open'); });
    epOverlay.addEventListener('click', function(e) { if (e.target === epOverlay) epOverlay.classList.remove('open'); });

    document.getElementById('ep-search').addEventListener('input', function() {
        var q = this.value.toLowerCase();
        document.querySelectorAll('#ep-modal-list .ep-item').forEach(function(item) {
            item.style.display = item.textContent.toLowerCase().includes(q) ? '' : 'none';
        });
    });

    var params = new URLSearchParams(window.location.search);
    var animeSlug = params.get('anime') || '';
    var epLink = params.get('ep') || '';
    var epNome = decodeURIComponent(params.get('nome') || 'Episódio');
    var epIndex = parseInt(params.get('idx') || '0', 10);

    document.getElementById('header-title').textContent = epNome;

    var allEpisodes = [];
    var animeData = null;

    async function carregarPlayer() {
        if (!epLink) {
            mostrarErro('Nenhum episódio selecionado.', 'Volte e selecione um episódio para assistir.');
            return;
        }
        try {
            if (animeSlug) {
                try {
                    var resD = await fetch(API_BASE + getApiPrefix() + '/detalhes?anime=' + animeSlug);
                    animeData = await resD.json();
                    allEpisodes = animeData.episodios || [];
                } catch(e) { console.warn('Detalhes não carregados:', e); }
            }
            var resP = await fetch(API_BASE + getApiPrefix() + '/player?link=' + encodeURIComponent(epLink));
            var playerData = await resP.json();
            if (playerData.erro) { mostrarErro('Erro ao carregar vídeo', playerData.erro); return; }
            exibirPlayer(playerData);
        } catch(e) {
            console.error(e);
            mostrarErro('Erro ao conectar', 'Verifique se o servidor está rodando na porta 3000.');
        }
    }

    function exibirPlayer(data) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('conteudo').style.display = 'block';

        document.getElementById('ep-title').textContent = epNome;

        var video = document.getElementById('main-video');
        var sources = data.sources || [];

        if (sources.length === 0 && data.iframe) {
            var wrapper = document.getElementById('video-wrapper');
            wrapper.innerHTML = '<iframe src="' + data.iframe + '" allowfullscreen allow="autoplay; encrypted-media" style="position:absolute;top:0;left:0;width:100%;height:100%;border:none;border-radius:16px 16px 0 0"></iframe>';
        } else if (sources.length > 0) {
            var best = sources[sources.length - 1];
            video.src = best.url;
            video.play().catch(function(){});

            if (sources.length > 1) {
                document.getElementById('quality-section').style.display = 'block';
                var qBtns = document.getElementById('quality-btns');
                sources.forEach(function(s, i) {
                    var btn = document.createElement('button');
                    btn.className = 'quality-btn' + (i === sources.length - 1 ? ' active' : '');
                    btn.textContent = s.label || s.quality || ('Fonte ' + (i + 1));
                    btn.addEventListener('click', function() {
                        var ct = video.currentTime;
                        video.src = s.url;
                        video.currentTime = ct;
                        video.play().catch(function(){});
                        qBtns.querySelectorAll('.quality-btn').forEach(function(b){ b.classList.remove('active'); });
                        btn.classList.add('active');
                    });
                    qBtns.appendChild(btn);
                });
            }
        } else {
            mostrarErro('Nenhuma fonte encontrada', 'O episódio pode estar indisponível.');
            return;
        }

        if (animeData && animeData.sinopse) {
            document.getElementById('sinopse').textContent = animeData.sinopse;
        }

        if (allEpisodes.length > 0) {
            document.getElementById('btn-episodes').style.display = 'flex';
            var list = document.getElementById('ep-modal-list');
            allEpisodes.forEach(function(ep, i) {
                var a = document.createElement('a');
                a.className = 'ep-item' + (i === epIndex ? ' active' : '');
                a.href = 'player-animes.html?anime=' + encodeURIComponent(animeSlug) +
                    '&ep=' + encodeURIComponent(ep.link) +
                    '&nome=' + encodeURIComponent(ep.nome || ('Episódio ' + (i + 1))) +
                    '&idx=' + i;
                a.innerHTML = '<span class="ep-item-num">' + (i + 1) + '</span>' +
                    '<span>' + (ep.nome || ('Episódio ' + (i + 1))) + '</span>';
                list.appendChild(a);
            });
        }

        var btnNext = document.getElementById('btn-next');
        if (epIndex < allEpisodes.length - 1 && allEpisodes[epIndex + 1]) {
            var next = allEpisodes[epIndex + 1];
            btnNext.href = 'player-animes.html?anime=' + encodeURIComponent(animeSlug) +
                '&ep=' + encodeURIComponent(next.link) +
                '&nome=' + encodeURIComponent(next.nome) +
                '&idx=' + (epIndex + 1);
        } else {
            btnNext.classList.add('disabled');
        }
    }

    function mostrarErro(titulo, msg) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('conteudo').style.display = 'block';
        document.getElementById('conteudo').innerHTML =
            '<div class="error-box" style="margin-top:60px"><h3>' + titulo + '</h3><p>' + msg + '</p></div>';
    }

    carregarPlayer();
    </script>

<!-- ══════ DRAKSYON FIREBASE INTEGRATION ══════ -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
(function(){
    // ═══ CONFIGURAÇÃO FIREBASE ═══
    // SUBSTITUA com as suas credenciais do Firebase Console > Configurações > Seus apps > Config
    var firebaseConfig = {
        apiKey: "SUA_API_KEY",
        authDomain: "seu-projeto.firebaseapp.com",
        databaseURL: "https://seu-projeto-default-rtdb.firebaseio.com",
        projectId: "seu-projeto",
        storageBucket: "seu-projeto.appspot.com",
        messagingSenderId: "123456789",
        appId: "1:123456789:web:abcdef"
    };
    // ═══════════════════════════════

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    var db = firebase.database();
    var PAGE_NAME = document.title || 'unknown';

    // ── Gerar UID único por dispositivo ──
    var LS_UID = 'draksyon_uid';
    var uid = localStorage.getItem(LS_UID);
    if (!uid) {
        uid = 'u_' + Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 6);
        localStorage.setItem(LS_UID, uid);
    }

    // ── Registrar usuário único ──
    db.ref('analytics/unique_users/' + uid).set({
        first_seen: firebase.database.ServerValue.TIMESTAMP,
        last_seen: firebase.database.ServerValue.TIMESTAMP,
        user_agent: navigator.userAgent.substr(0, 100)
    });

    // ── Presença online (Realtime) ──
    var onlineRef = db.ref('online_users/' + uid);
    var connectedRef = db.ref('.info/connected');
    connectedRef.on('value', function(snap) {
        if (snap.val() === true) {
            onlineRef.onDisconnect().remove();
            onlineRef.set({
                page: PAGE_NAME,
                last_seen: firebase.database.ServerValue.TIMESTAMP
            });
        }
    });
    // Atualizar presença a cada 60s
    setInterval(function() {
        onlineRef.update({
            page: PAGE_NAME,
            last_seen: firebase.database.ServerValue.TIMESTAMP
        });
    }, 60000);

    // ── Analytics: visualização de página ──
    var today = new Date().toISOString().split('T')[0];
    db.ref('analytics/page_views/' + PAGE_NAME.replace(/[^a-zA-Z0-9]/g, '_')).transaction(function(c) { return (c || 0) + 1; });
    db.ref('analytics/daily/' + today + '/visits').transaction(function(c) { return (c || 0) + 1; });

    // ── Analytics: anime views ──
    var urlParams = new URLSearchParams(window.location.search);
    var animeParam = urlParams.get('anime');
    if (animeParam) {
        var safeSlug = animeParam.replace(/[^a-zA-Z0-9_-]/g, '_');
        db.ref('analytics/anime_views/' + safeSlug + '/count').transaction(function(c) { return (c || 0) + 1; });
        db.ref('analytics/anime_views/' + safeSlug + '/title').set(animeParam);
        db.ref('analytics/daily/' + today + '/animes_viewed').transaction(function(c) { return (c || 0) + 1; });
    }

    // ── Analytics: episódios assistidos (player) ──
    if (PAGE_NAME.toLowerCase().indexOf('player') !== -1) {
        db.ref('analytics/daily/' + today + '/episodes_watched').transaction(function(c) { return (c || 0) + 1; });
    }

    // ── Verificar modo manutenção ──
    db.ref('app_config/maintenance').on('value', function(snap) {
        var maint = snap.val();
        if (maint && maint.active) {
            showMaintenanceScreen(maint.message || 'Estamos em manutenção. Voltamos em breve!');
        } else {
            removeMaintenanceScreen();
        }
    });

    function showMaintenanceScreen(msg) {
        if (document.getElementById('draksyon-maintenance')) return;
        var div = document.createElement('div');
        div.id = 'draksyon-maintenance';
        div.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#0a0a12;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:-apple-system,sans-serif;text-align:center;padding:40px;';
        div.innerHTML = '<div style="font-size:60px;margin-bottom:20px;">🔧</div>' +
            '<h1 style="font-size:24px;font-weight:700;margin-bottom:12px;color:#fff;">Em Manutenção</h1>' +
            '<p style="font-size:15px;color:#888;max-width:400px;line-height:1.6;">' + msg + '</p>' +
            '<div style="margin-top:30px;width:200px;height:3px;border-radius:99px;background:rgba(255,255,255,0.06);overflow:hidden;">' +
            '<div style="width:40%;height:100%;background:#254BFF;border-radius:99px;animation:maintPulse 1.5s ease-in-out infinite alternate;"></div></div>';
        var style = document.createElement('style');
        style.textContent = '@keyframes maintPulse{from{transform:translateX(-50%)}to{transform:translateX(150%)}}';
        div.appendChild(style);
        document.body.appendChild(div);
    }

    function removeMaintenanceScreen() {
        var el = document.getElementById('draksyon-maintenance');
        if (el) el.remove();
    }

    // ── Verificar usuário bloqueado ──
    db.ref('blocked_users/' + uid).on('value', function(snap) {
        if (snap.val()) {
            document.body.innerHTML = '<div style="position:fixed;inset:0;background:#0a0a12;display:flex;align-items:center;justify-content:center;color:#ff5555;font-size:18px;font-family:monospace;text-align:center;padding:40px;">Seu acesso foi bloqueado.<br>Entre em contato com o suporte.</div>';
        }
    });

    // ── Escutar mensagens de diálogo (popup) ──
    var shownDialogs = JSON.parse(localStorage.getItem('draksyon_shown_dialogs') || '[]');
    db.ref('app_messages').orderByChild('active').equalTo(true).on('child_added', function(snap) {
        var key = snap.key;
        if (shownDialogs.indexOf(key) !== -1) return;
        var msg = snap.val();
        if (!msg || !msg.active) return;
        showDialog(msg.title, msg.message, msg.type || 'info', msg.duration || 0, key);
    });

    function showDialog(title, message, type, duration, key) {
        var colors = { info: '#254BFF', warning: '#f59e0b', error: '#ef4444', success: '#22c55e' };
        var icons = { info: 'ℹ️', warning: '⚠️', error: '❌', success: '✅' };
        var color = colors[type] || colors.info;
        var icon = icons[type] || icons.info;

        var overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;inset:0;z-index:99998;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;padding:20px;animation:dkDialogFadeIn .3s ease;';
        var box = document.createElement('div');
        box.style.cssText = 'background:#18181b;border-radius:16px;padding:28px 24px;max-width:380px;width:100%;text-align:center;border:1px solid ' + color + '33;box-shadow:0 20px 60px rgba(0,0,0,0.5);';
        box.innerHTML = '<div style="font-size:36px;margin-bottom:12px;">' + icon + '</div>' +
            '<h3 style="font-size:18px;font-weight:700;color:#fff;margin-bottom:10px;">' + title + '</h3>' +
            '<p style="font-size:14px;color:#9aa0a6;line-height:1.6;margin-bottom:20px;">' + message + '</p>' +
            '<button onclick="this.closest('div[style*=fixed]').remove()" style="background:' + color + ';color:#fff;border:none;padding:10px 30px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;">Entendi</button>';

        var style = document.createElement('style');
        style.textContent = '@keyframes dkDialogFadeIn{from{opacity:0}to{opacity:1}}';
        overlay.appendChild(style);
        overlay.appendChild(box);
        overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });
        document.body.appendChild(overlay);

        shownDialogs.push(key);
        localStorage.setItem('draksyon_shown_dialogs', JSON.stringify(shownDialogs));

        if (duration > 0) {
            setTimeout(function() { if (overlay.parentNode) overlay.remove(); }, duration * 1000);
        }
    }

    // ── Escutar banner ──
    db.ref('app_config/banner').on('value', function(snap) {
        var banner = snap.val();
        var existing = document.getElementById('draksyon-banner');
        if (existing) existing.remove();
        if (!banner || !banner.active) return;

        var div = document.createElement('div');
        div.id = 'draksyon-banner';
        div.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9998;background:' + (banner.color || '#254BFF') + ';color:#fff;text-align:center;padding:8px 40px 8px 16px;font-size:13px;font-weight:600;font-family:-apple-system,sans-serif;';
        div.textContent = banner.text;

        if (banner.link) {
            div.style.cursor = 'pointer';
            div.addEventListener('click', function() { window.open(banner.link, '_blank'); });
        }

        var closeBtn = document.createElement('button');
        closeBtn.textContent = '✕';
        closeBtn.style.cssText = 'position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:#fff;font-size:16px;cursor:pointer;opacity:0.7;';
        closeBtn.addEventListener('click', function(e) { e.stopPropagation(); div.remove(); document.body.style.paddingTop = ''; });
        div.appendChild(closeBtn);

        document.body.insertBefore(div, document.body.firstChild);
        // Adjust body padding
        document.body.style.paddingTop = (parseInt(getComputedStyle(document.body).paddingTop) + div.offsetHeight) + 'px';
    });

    // ── Escutar anúncio popup ──
    var announcementShown = localStorage.getItem('draksyon_announcement_shown');
    db.ref('app_config/announcement').on('value', function(snap) {
        var ann = snap.val();
        if (!ann || !ann.active) return;
        var annKey = ann.created_at || 'default';
        if (announcementShown === annKey) return;

        var overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;inset:0;z-index:99997;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;padding:20px;animation:dkAnnFadeIn .3s ease;';

        var content = '<h2 style="font-size:20px;font-weight:700;color:#fff;margin-bottom:10px;">' + ann.title + '</h2>';
        if (ann.image) content += '<img src="' + ann.image + '" style="width:100%;max-height:200px;object-fit:cover;border-radius:10px;margin-bottom:12px;">';
        content += '<p style="font-size:14px;color:#9aa0a6;line-height:1.6;margin-bottom:20px;">' + ann.message + '</p>';
        content += '<button onclick="this.closest('div[style*=fixed]').remove()" style="background:#254BFF;color:#fff;border:none;padding:12px 30px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;">Fechar</button>';

        var box = document.createElement('div');
        box.style.cssText = 'background:#18181b;border-radius:16px;padding:28px 24px;max-width:420px;width:100%;text-align:center;border:1px solid rgba(37,75,255,0.2);';
        box.innerHTML = content;

        var style = document.createElement('style');
        style.textContent = '@keyframes dkAnnFadeIn{from{opacity:0;transform:scale(0.95)}to{opacity:1;transform:scale(1)}}';
        overlay.appendChild(style);
        overlay.appendChild(box);
        overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });
        document.body.appendChild(overlay);

        localStorage.setItem('draksyon_announcement_shown', annKey);
    });

    // ── Escutar status dos servidores ──
    db.ref('app_config/servers').on('value', function(snap) {
        var servers = snap.val();
        if (!servers) return;
        var currentSrv = localStorage.getItem('draksyon_server_v1') || 's1';
        var srvData = servers[currentSrv];
        if (srvData && srvData.status === 'offline') {
            showDialog('Servidor Indisponível', srvData.message || 'O servidor selecionado está offline. Tente trocar de servidor.', 'error', 0, 'srv_offline_' + Date.now());
        }
    });

    // ── Escutar notificações ──
    var lastNotifCheck = localStorage.getItem('draksyon_last_notif') || '2000-01-01';
    db.ref('notifications').orderByChild('created_at').startAt(lastNotifCheck).on('child_added', function(snap) {
        var notif = snap.val();
        if (!notif || notif.read) return;
        // Show as small toast
        var toast = document.createElement('div');
        toast.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:99996;background:#18181b;border:1px solid rgba(37,75,255,0.3);border-radius:12px;padding:14px 18px;max-width:320px;box-shadow:0 10px 40px rgba(0,0,0,0.5);animation:dkToastIn .3s ease;font-family:-apple-system,sans-serif;';
        toast.innerHTML = '<div style="font-size:13px;font-weight:700;color:#fff;margin-bottom:4px;">🔔 ' + (notif.title || 'Notificação') + '</div>' +
            '<div style="font-size:12px;color:#888;">' + (notif.message || '') + '</div>';

        var style = document.createElement('style');
        style.textContent = '@keyframes dkToastIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}';
        toast.appendChild(style);
        document.body.appendChild(toast);

        setTimeout(function() { if (toast.parentNode) toast.remove(); }, 8000);
        localStorage.setItem('draksyon_last_notif', new Date().toISOString());
    });

    // ── Log de erros ──
    window.addEventListener('error', function(e) {
        db.ref('error_logs').push({
            message: (e.message || '').substr(0, 200),
            page: PAGE_NAME,
            timestamp: new Date().toISOString(),
            url: (e.filename || '').substr(0, 100),
            line: e.lineno || 0
        });
    });

    // ── Verificar versão ──
    db.ref('app_config/version').on('value', function(snap) {
        var ver = snap.val();
        if (!ver || !ver.force_update) return;
        var currentVer = localStorage.getItem('draksyon_app_version');
        if (currentVer === ver.current) return;
        if (ver.update_url) {
            showDialog('Atualização Disponível', 'Uma nova versão (' + ver.current + ') está disponível. Clique para atualizar.', 'info', 0, 'update_' + ver.current);
        }
        localStorage.setItem('draksyon_app_version', ver.current);
    });

    // ── Limpar presença ao sair ──
    window.addEventListener('beforeunload', function() {
        onlineRef.remove();
    });

})();
</script>
