    <meta charset="UTF-8">

    <title>Draksyon - Detalhes</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        html,body{height:100%}
        body{
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
            background:#0d0d0f;
            color:#fff;
            -webkit-font-smoothing:antialiased;
            overflow-y:auto;
            padding-top:65px;
        }
        ::-webkit-scrollbar{width:5px;height:6px}
        ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.06);border-radius:999px}
        ::-webkit-scrollbar-track{background:transparent}

        /* ── Header (igual index) ── */
        .otk-header-fixed{
            position:fixed;top:0;left:0;right:0;height:65px;
            display:flex;align-items:center;justify-content:space-between;
            padding:0 18px;
            background:rgba(13,13,15,0.85);
            backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
            border-bottom:1px solid rgba(255,255,255,0.04);
            z-index:100;
        }
        .header-inner{
            width:100%;max-width:1200px;margin:0 auto;
            display:flex;align-items:center;justify-content:space-between;
        }
        .header-title{font-size:18px;font-weight:700;color:#fff;letter-spacing:1px;text-align:center;flex:1}
        .header-right{display:flex;align-items:center;gap:8px}
        .icon-btn{background:transparent;border:none;color:#fff;cursor:pointer;padding:6px;display:flex;align-items:center;justify-content:center;transition:opacity .3s}
        .icon-btn:hover{opacity:.7}
        .server-indicator{font-size:10px;color:#5B7FFF;font-weight:700;padding:3px 8px;border-radius:6px;background:rgba(37,75,255,0.1);border:1px solid rgba(37,75,255,0.2);white-space:nowrap}

        /* ── Drawer (igual index) ── */
        .drawer-overlay{
            position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:150;
            opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s;
            backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
        }
        .drawer-overlay.open{opacity:1;visibility:visible}
        .drawer{
            position:fixed;top:0;left:0;bottom:0;width:270px;max-width:80vw;
            background:#111113;z-index:200;
            transform:translateX(-100%);
            transition:transform .35s cubic-bezier(.4,0,.2,1);
            display:flex;flex-direction:column;
            border-right:1px solid rgba(255,255,255,0.06);
            overflow-y:auto;
        }
        .drawer.open{transform:translateX(0)}
        .drawer-top{
            padding:20px 16px 14px;
            display:flex;align-items:center;justify-content:space-between;
            border-bottom:1px solid rgba(255,255,255,0.06);
        }
        .drawer-brand-row{display:flex;align-items:center;gap:10px}
        .drawer-brand-logo{
            width:34px;height:34px;border-radius:8px;
            background:linear-gradient(135deg,#254BFF,#3A56F6);
            display:flex;align-items:center;justify-content:center;
            box-shadow:0 3px 10px rgba(37,75,255,0.3);overflow:hidden;
        }
        .drawer-brand-logo img{width:100%;height:100%;object-fit:cover;border-radius:8px}
        .drawer-brand-title{font-size:15px;font-weight:700;color:#fff;letter-spacing:.5px}
        .drawer-close-btn{
            background:none;border:none;color:#666;
            width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:color .2s;
        }
        .drawer-close-btn:hover{color:#fff}
        .drawer-nav{list-style:none;padding:8px 8px 0}
        .drawer-nav-item{
            display:flex;align-items:center;gap:12px;
            padding:11px 12px;border-radius:8px;cursor:pointer;
            color:#888;font-size:14px;font-weight:500;
            transition:all .2s;border:none;background:none;width:100%;text-align:left;text-decoration:none;
        }
        .drawer-nav-item:hover{background:rgba(255,255,255,0.04);color:#ccc}
        .drawer-nav-item.active{background:rgba(37,75,255,0.12);color:#fff}
        .drawer-nav-item svg{width:18px;height:18px;flex-shrink:0;opacity:.6}
        .drawer-nav-item.active svg{opacity:1;color:#5B7FFF}
        li + li .drawer-nav-item{margin-top:1px}
        .drawer-divider{height:1px;background:rgba(255,255,255,0.05);margin:6px 16px}
        .drawer-section-label{padding:10px 16px 4px;font-size:11px;font-weight:700;color:#555;letter-spacing:1px;text-transform:uppercase}
        .server-option{
            display:flex;align-items:center;gap:12px;
            padding:10px 12px;border-radius:8px;cursor:pointer;
            color:#888;font-size:13px;font-weight:500;
            transition:all .2s;border:none;background:none;width:100%;text-align:left;
        }
        .server-option:hover{background:rgba(255,255,255,0.04);color:#ccc}
        .server-option.active{background:rgba(37,75,255,0.12);color:#fff}
        .server-radio{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:border-color .2s}
        .server-option.active .server-radio{border-color:#254BFF}
        .server-radio-dot{width:8px;height:8px;border-radius:50%;background:#254BFF;display:none}
        .server-option.active .server-radio-dot{display:block}
        .server-name{flex:1}
        .server-badge{font-size:10px;padding:2px 7px;border-radius:4px;background:rgba(37,75,255,0.15);color:#5B7FFF;font-weight:600}
        .drawer-footer{margin-top:auto;padding:14px 16px;border-top:1px solid rgba(255,255,255,0.05);display:flex;align-items:center;gap:10px}
        .drawer-avatar{width:35px;height:35px;border-radius:50%;background:#1a1a1e;background-size:cover;background-position:center;flex-shrink:0}
        .drawer-user-info{display:flex;flex-direction:column;gap:1px;flex:1}
        .drawer-user-name{font-size:14px;font-weight:600;color:#ddd}
        .drawer-user-role{font-size:11px;color:#555}

        /* ── Hero area ── */
        .hero-area{
            position:relative;overflow:hidden;
            padding:30px 20px 0;
            display:flex;flex-direction:column;align-items:center;
            text-align:center;
        }
        .hero-bg{
            position:absolute;inset:0;
            background-size:cover;background-position:center;
            filter:blur(30px) saturate(1.2);opacity:.2;transform:scale(1.3);
        }
        .hero-gradient{
            position:absolute;inset:0;
            background:linear-gradient(180deg,rgba(13,13,15,0.3) 0%,rgba(13,13,15,0.7) 50%,rgba(13,13,15,1) 100%);
        }
        .hero-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;max-width:600px;width:100%}
        .hero-poster{
            width:160px;height:230px;
            border-radius:14px;object-fit:cover;
            border:2px solid rgba(255,255,255,0.06);
            box-shadow:0 20px 50px -12px rgba(0,0,0,0.8);
        }
        .anime-title{
            font-size:20px;font-weight:700;
            color:#fff;line-height:1.35;
            margin-top:18px;
            display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
        }

        /* ── Assistir button ── */
        .btn-assistir-main{
            display:flex;align-items:center;justify-content:center;gap:10px;
            width:100%;max-width:400px;
            margin-top:18px;
            padding:14px 20px;
            background:linear-gradient(90deg,#254BFF,#3A56F6);
            color:#fff;border:none;border-radius:12px;
            font-size:16px;font-weight:700;
            cursor:pointer;
            box-shadow:0 8px 24px rgba(37,75,255,0.35);
            transition:box-shadow .3s;
            text-decoration:none;
        }
        .btn-assistir-main:hover{box-shadow:0 12px 32px rgba(37,75,255,0.5)}
        .btn-assistir-main svg{width:18px;height:18px}

        /* ── Subtitle ── */
        .anime-subtitle{
            margin-top:12px;
            font-size:13px;color:#9aa0a6;line-height:1.5;
            padding-bottom:24px;
        }

        /* ── Main Content ── */
        .main-content{max-width:1100px;margin:0 auto;padding:0 16px 30px}

        /* ── Section headers ── */
        .section-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
        .section-icon{width:24px;height:24px;color:#E85D5D;flex-shrink:0}
        .section-icon.blue{color:#5B7FFF}
        .section-title{font-size:18px;color:#fff;font-weight:700}

        /* ── Descrição ── */
        .descricao-section{margin-bottom:24px}
        .descricao-text{
            font-size:14px;color:#9aa0a6;line-height:1.7;
            max-height:180px;overflow-y:auto;
        }

        /* ── Genre chips ── */
        .genre-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
        .genre-chip{
            padding:8px 16px;border-radius:10px;
            background:rgba(255,255,255,0.06);
            border:1px solid rgba(255,255,255,0.08);
            font-size:13px;color:#ccc;font-weight:500;
            transition:all .2s;cursor:default;
        }
        .genre-chip:hover{border-color:rgba(37,75,255,0.3);color:#fff}
        .genre-chip.hidden{display:none}
        .genre-toggle{
            padding:8px 16px;border-radius:10px;
            background:rgba(37,75,255,0.08);
            border:1px solid rgba(37,75,255,0.2);
            font-size:13px;color:#5B7FFF;font-weight:600;
            cursor:pointer;transition:all .2s;
        }
        .genre-toggle:hover{background:rgba(37,75,255,0.15);border-color:rgba(37,75,255,0.4)}

        /* ── Episódios toolbar ── */
        .ep-toolbar{
            display:flex;align-items:center;gap:10px;
            margin-bottom:12px;
        }
        .ep-search-box{position:relative;flex:1}
        .ep-search{
            width:100%;padding:11px 14px 11px 40px;
            background:rgba(255,255,255,0.05);
            border:1px solid rgba(255,255,255,0.08);
            border-radius:10px;color:#fff;font-size:14px;outline:none;
            transition:border-color .2s;
        }
        .ep-search:focus{border-color:rgba(37,75,255,0.4)}
        .ep-search::placeholder{color:#555}
        .ep-search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#555;pointer-events:none}
        .ep-ordenar{
            width:42px;height:42px;
            display:flex;align-items:center;justify-content:center;
            background:rgba(255,255,255,0.05);
            border:1px solid rgba(255,255,255,0.08);border-radius:10px;
            color:#9aa0a6;cursor:pointer;transition:all .2s;flex-shrink:0;
        }
        .ep-ordenar:hover{border-color:rgba(37,75,255,0.3);color:#fff;background:rgba(37,75,255,0.06)}
        .ep-ordenar svg{width:18px;height:18px}

        /* ── Episode list ── */
        .ep-list{display:flex;flex-direction:column;gap:10px;padding-bottom:24px}
        .ep-card{
            display:flex;align-items:center;gap:12px;
            text-decoration:none;color:#fff;
            background:rgba(255,255,255,0.04);
            border-radius:12px;padding:14px 12px;
            border:1px solid rgba(255,255,255,0.06);
            transition:border-color .3s,background .3s;cursor:pointer;
        }
        .ep-card:hover{border-color:rgba(37,75,255,0.2);background:rgba(255,255,255,0.06)}
        .ep-card-info{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
        .ep-card-title{
            font-size:15px;font-weight:700;line-height:1.3;
            display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;
        }
        .ep-card-status{font-size:12px;color:#666;letter-spacing:.3px}
        .ep-card-play{
            width:44px;height:44px;
            border-radius:50%;flex-shrink:0;
            background:linear-gradient(135deg,#254BFF,#3A56F6);
            display:flex;align-items:center;justify-content:center;
            box-shadow:0 4px 14px rgba(37,75,255,0.35);
            transition:box-shadow .3s;
        }
        .ep-card:hover .ep-card-play{box-shadow:0 6px 20px rgba(37,75,255,0.5)}
        .ep-card-play svg{width:18px;height:18px;color:#fff;margin-left:2px}

        /* ── Favoritar ── */
        .btn-fav{
            display:inline-flex;gap:6px;align-items:center;justify-content:center;
            cursor:pointer;font-weight:600;font-size:12px;
            background:transparent;color:#fff;
            border:1px solid rgba(255,255,255,0.12);
            border-radius:10px;padding:8px 14px;
            transition:all .3s;margin-top:10px;
        }
        .btn-fav:hover{background:rgba(255,255,255,0.05)}
        .btn-fav.active{background:rgba(37,75,255,0.15);border-color:rgba(37,75,255,0.4)}
        .btn-fav svg{width:14px;height:14px}

        .loading-screen{display:flex;align-items:center;justify-content:center;min-height:60vh;color:#9aa0a6;font-size:15px}
        .content-wrapper{display:none}

        /* ── Responsive ── */
        @media(max-width:340px){
            .hero-poster{width:130px;height:190px}
            .anime-title{font-size:17px}
        }
        @media(min-width:400px){
            .hero-poster{width:170px;height:245px}
            .anime-title{font-size:22px}
        }
        @media(min-width:600px){
            .hero-poster{width:190px;height:275px}
            .anime-title{font-size:24px}
            .main-content{padding:0 24px 40px}
        }
        @media(min-width:768px){
            .otk-header-fixed{padding:0 28px}
            .header-title{font-size:22px}
            .hero-poster{width:200px;height:290px}
            .anime-title{font-size:26px}
            .main-content{padding:0 28px 40px}
            .ep-list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
        }
        @media(min-width:1024px){
            .hero-poster{width:220px;height:320px}
            .anime-title{font-size:28px}
            .main-content{padding:0 40px 50px}
        }
        @media(min-width:1280px){
            .ep-list{grid-template-columns:repeat(3,1fr)}
        }
        @media(max-width:380px){
            .main-content{padding:0 14px 30px}
        }
    </style>
</head>

    <script>
    var API_BASE = 'http://127.0.0.1:3000';
    var LS_SERVER = 'draksyon_server_v1';
    var currentServer = localStorage.getItem(LS_SERVER) || 's1';
    var animeSlug = new URLSearchParams(window.location.search).get('anime') || '';

    function getApiPrefix() { return currentServer === 's2' ? '/api/s2' : '/api'; }

    // Server indicator
    var indicator = document.getElementById('server-indicator');
    if (currentServer === 's2') { indicator.textContent = 'S2'; indicator.title = 'Animes Online'; }
    else { indicator.textContent = 'S1'; indicator.title = 'AnimeFire'; }

    // Drawer
    var drawer = document.getElementById('drawer');
    var overlay = document.getElementById('drawer-overlay');
    document.getElementById('menu-btn').addEventListener('click', function(){ drawer.classList.add('open'); overlay.classList.add('open'); });
    document.getElementById('drawer-close').addEventListener('click', function(){ drawer.classList.remove('open'); overlay.classList.remove('open'); });
    overlay.addEventListener('click', function(){ drawer.classList.remove('open'); overlay.classList.remove('open'); });

    // Server selector in drawer
    var serverBtns = document.querySelectorAll('#server-list .server-option');
    serverBtns.forEach(function(btn){
        if(btn.dataset.server === currentServer) btn.classList.add('active');
        btn.addEventListener('click', function(){
            serverBtns.forEach(function(b){ b.classList.remove('active'); });
            btn.classList.add('active');
            currentServer = btn.dataset.server;
            localStorage.setItem(LS_SERVER, currentServer);
            if (currentServer === 's2') { indicator.textContent = 'S2'; indicator.title = 'Animes Online'; }
            else { indicator.textContent = 'S1'; indicator.title = 'AnimeFire'; }
            drawer.classList.remove('open'); overlay.classList.remove('open');
            document.getElementById('loading').style.display = 'flex';
            document.getElementById('conteudo').style.display = 'none';
            carregar();
        });
    });

    var allEpisodes = [];
    var ascending = false;
    var isFav = false;
    var LS_FAV = 'draksyon_favs_v1';
    var genresExpanded = false;

    function getFavs(){ return JSON.parse(localStorage.getItem(LS_FAV)||'[]'); }
    function saveFavs(arr){ localStorage.setItem(LS_FAV, JSON.stringify(arr)); }

    async function carregar() {
        if (!animeSlug) { document.getElementById('loading').textContent = 'Nenhum anime selecionado.'; return; }
        try {
            var res = await fetch(API_BASE + getApiPrefix() + '/detalhes?anime=' + animeSlug);
            var data = await res.json();

            document.getElementById('titulo').innerText = data.titulo || 'Sem título';
            var capaUrl = data.capa || '';
            document.getElementById('capa').src = capaUrl;
            document.getElementById('hero-bg').style.backgroundImage = 'url(' + capaUrl + ')';
            document.getElementById('sinopse').innerText = data.sinopse || 'Sinopse não disponível.';

            // Subtitle
            var subtitle = document.getElementById('anime-subtitle');
            subtitle.innerText = 'Assistir ' + (data.titulo || '') + ' Online';

            // First episode button
            var eps = data.episodios || [];
            allEpisodes = eps;
            if (eps.length > 0) {
                var firstEp = eps[0];
                var btnAssistir = document.getElementById('btn-assistir-primeiro');
                btnAssistir.href = 'player-animes.html?anime=' + encodeURIComponent(animeSlug) +
                    '&ep=' + encodeURIComponent(firstEp.link) +
                    '&nome=' + encodeURIComponent(firstEp.nome || 'Episódio 1') +
                    '&idx=0';
                document.getElementById('btn-assistir-label').textContent = 'Assistir S1E01';
            }

            // Favoritos
            var favs = getFavs();
            isFav = favs.indexOf(animeSlug) !== -1;
            updateFavUI();

            document.getElementById('fav-btn').addEventListener('click', function(){
                var favs = getFavs();
                if(isFav){ favs = favs.filter(function(x){return x!==animeSlug;}); isFav=false; }
                else { favs.push(animeSlug); isFav=true; }
                saveFavs(favs);
                updateFavUI();
            });

            // Gêneros
            var genreRow = document.getElementById('genre-row');
            genreRow.innerHTML = '';
            var allGenres = data.generos || [];
            allGenres.forEach(function(g, i) {
                var chip = document.createElement('span');
                chip.className = 'genre-chip' + (i >= 6 ? ' hidden' : '');
                chip.textContent = g;
                genreRow.appendChild(chip);
            });
            if (allGenres.length > 6) {
                var toggleBtn = document.createElement('button');
                toggleBtn.className = 'genre-toggle';
                toggleBtn.id = 'genre-toggle';
                toggleBtn.textContent = '+' + (allGenres.length - 6) + ' mais';
                toggleBtn.addEventListener('click', function() {
                    genresExpanded = !genresExpanded;
                    var chips = genreRow.querySelectorAll('.genre-chip');
                    chips.forEach(function(c, i) { if (i >= 6) c.classList.toggle('hidden', !genresExpanded); });
                    toggleBtn.textContent = genresExpanded ? 'Ver menos' : '+' + (allGenres.length - 6) + ' mais';
                });
                genreRow.appendChild(toggleBtn);
            }

            renderEpisodes(allEpisodes);

            document.getElementById('loading').style.display = 'none';
            document.getElementById('conteudo').style.display = 'block';
        } catch (e) {
            console.error(e);
            var serverName = currentServer === 's2' ? 'Animes Online' : 'AnimeFire';
            document.getElementById('loading').innerHTML = 'Erro ao carregar (' + serverName + ').<br><span style="font-size:12px;color:#555;">Verifique se o servidor está rodando na porta 3000.</span>';
        }
    }

    function updateFavUI(){
        var btn = document.getElementById('fav-btn');
        if(isFav){
            btn.classList.add('active');
            btn.innerHTML = '<svg viewBox="0 0 24 24" fill="#254BFF" stroke="#254BFF" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg> FAVORITADO';
        } else {
            btn.classList.remove('active');
            btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg> FAVORITAR';
        }
    }

    function renderEpisodes(eps) {
        var lista = document.getElementById('ep-list');
        lista.innerHTML = '';
        eps.forEach(function(ep, idx) {
            var card = document.createElement('a');
            card.className = 'ep-card';
            card.href = 'player-animes.html?anime=' + encodeURIComponent(animeSlug) +
                '&ep=' + encodeURIComponent(ep.link) +
                '&nome=' + encodeURIComponent(ep.nome || ('Episódio ' + (idx + 1))) +
                '&idx=' + idx;
            var titulo = ep.nome || 'Episódio ' + (idx + 1);
            card.innerHTML =
                '<div class="ep-card-info">' +
                    '<div class="ep-card-title">' + titulo + '</div>' +
                    '<div class="ep-card-status">Legendado</div>' +
                '</div>' +
                '<div class="ep-card-play"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>';
            lista.appendChild(card);
        });
    }

    document.getElementById('btn-ordenar').addEventListener('click', function() {
        ascending = !ascending;
        var sorted = allEpisodes.slice();
        if (ascending) sorted.reverse();
        renderEpisodes(sorted);
    });

    document.getElementById('ep-search').addEventListener('input', function(e) {
        var q = (e.target.value || '').trim();
        if (!q) { renderEpisodes(allEpisodes); return; }
        var filtered = allEpisodes.filter(function(ep) {
            var num = (ep.nome || '').replace(/[^0-9]/g, '');
            return num.indexOf(q) !== -1;
        });
        renderEpisodes(filtered);
    });

    document.getElementById('ep-search').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            var q = (e.target.value || '').trim();
            var idx = allEpisodes.findIndex(function(ep) { return (ep.nome || '').replace(/[^0-9]/g, '') === q; });
            if (idx !== -1 && allEpisodes[idx].link) {
                window.location.href = 'player-animes.html?anime=' + encodeURIComponent(animeSlug) +
                    '&ep=' + encodeURIComponent(allEpisodes[idx].link) +
                    '&nome=' + encodeURIComponent(allEpisodes[idx].nome) +
                    '&idx=' + idx;
            }
        }
    });

    carregar();
    </script>

<!-- ══════ DRAKSYON FIREBASE INTEGRATION ══════ -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
(function(){
    // ═══ CONFIGURAÇÃO FIREBASE ═══
    // SUBSTITUA com as suas credenciais do Firebase Console > Configurações > Seus apps > Config
    var firebaseConfig = {
        apiKey: "AIzaSyD4tBKUiCjfeCMFfaZ8ROs5F7UoQ25HrrI",
        authDomain: "animes-64408.firebaseapp.com",
        databaseURL: "https://animes-64408-default-rtdb.firebaseio.com",
        projectId: "animes-64408",
        storageBucket: "animes-64408.firebasestorage.app",
        messagingSenderId: "887589860807",
        appId: "1:887589860807:android:96c8ad7714f9d88de695e2"
    };
    // ═══════════════════════════════

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    var db = firebase.database();
    var PAGE_NAME = document.title || 'unknown';

    // ── Gerar UID único por dispositivo ──
    var LS_UID = 'draksyon_uid';
    var uid = localStorage.getItem(LS_UID);
    if (!uid) {
        uid = 'u_' + Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 6);
        localStorage.setItem(LS_UID, uid);
    }

    // ── Registrar usuário único ──
    db.ref('analytics/unique_users/' + uid).set({
        first_seen: firebase.database.ServerValue.TIMESTAMP,
        last_seen: firebase.database.ServerValue.TIMESTAMP,
        user_agent: navigator.userAgent.substr(0, 100)
    });

    // ── Presença online (Realtime) ──
    var onlineRef = db.ref('online_users/' + uid);
    var connectedRef = db.ref('.info/connected');
    connectedRef.on('value', function(snap) {
        if (snap.val() === true) {
            onlineRef.onDisconnect().remove();
            onlineRef.set({
                page: PAGE_NAME,
                last_seen: firebase.database.ServerValue.TIMESTAMP
            });
        }
    });
    // Atualizar presença a cada 60s
    setInterval(function() {
        onlineRef.update({
            page: PAGE_NAME,
            last_seen: firebase.database.ServerValue.TIMESTAMP
        });
    }, 60000);

    // ── Analytics: visualização de página ──
    var today = new Date().toISOString().split('T')[0];
    db.ref('analytics/page_views/' + PAGE_NAME.replace(/[^a-zA-Z0-9]/g, '_')).transaction(function(c) { return (c || 0) + 1; });
    db.ref('analytics/daily/' + today + '/visits').transaction(function(c) { return (c || 0) + 1; });

    // ── Analytics: anime views ──
    var urlParams = new URLSearchParams(window.location.search);
    var animeParam = urlParams.get('anime');
    if (animeParam) {
        var safeSlug = animeParam.replace(/[^a-zA-Z0-9_-]/g, '_');
        db.ref('analytics/anime_views/' + safeSlug + '/count').transaction(function(c) { return (c || 0) + 1; });
        db.ref('analytics/anime_views/' + safeSlug + '/title').set(animeParam);
        db.ref('analytics/daily/' + today + '/animes_viewed').transaction(function(c) { return (c || 0) + 1; });
    }

    // ── Analytics: episódios assistidos (player) ──
    if (PAGE_NAME.toLowerCase().indexOf('player') !== -1) {
        db.ref('analytics/daily/' + today + '/episodes_watched').transaction(function(c) { return (c || 0) + 1; });
    }

    // ── Verificar modo manutenção ──
    db.ref('app_config/maintenance').on('value', function(snap) {
        var maint = snap.val();
        if (maint && maint.active) {
            showMaintenanceScreen(maint.message || 'Estamos em manutenção. Voltamos em breve!');
        } else {
            removeMaintenanceScreen();
        }
    });

    function showMaintenanceScreen(msg) {
        if (document.getElementById('draksyon-maintenance')) return;
        var div = document.createElement('div');
        div.id = 'draksyon-maintenance';
        div.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#0a0a12;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:-apple-system,sans-serif;text-align:center;padding:40px;';
        div.innerHTML = '<div style="font-size:60px;margin-bottom:20px;">🔧</div>' +
            '<h1 style="font-size:24px;font-weight:700;margin-bottom:12px;color:#fff;">Em Manutenção</h1>' +
            '<p style="font-size:15px;color:#888;max-width:400px;line-height:1.6;">' + msg + '</p>' +
            '<div style="margin-top:30px;width:200px;height:3px;border-radius:99px;background:rgba(255,255,255,0.06);overflow:hidden;">' +
            '<div style="width:40%;height:100%;background:#254BFF;border-radius:99px;animation:maintPulse 1.5s ease-in-out infinite alternate;"></div></div>';
        var style = document.createElement('style');
        style.textContent = '@keyframes maintPulse{from{transform:translateX(-50%)}to{transform:translateX(150%)}}';
        div.appendChild(style);
        document.body.appendChild(div);
    }

    function removeMaintenanceScreen() {
        var el = document.getElementById('draksyon-maintenance');
        if (el) el.remove();
    }

    // ── Verificar usuário bloqueado ──
    db.ref('blocked_users/' + uid).on('value', function(snap) {
        if (snap.val()) {
            document.body.innerHTML = '<div style="position:fixed;inset:0;background:#0a0a12;display:flex;align-items:center;justify-content:center;color:#ff5555;font-size:18px;font-family:monospace;text-align:center;padding:40px;">Seu acesso foi bloqueado.<br>Entre em contato com o suporte.</div>';
        }
    });

    // ── Escutar mensagens de diálogo (popup) ──
    var shownDialogs = JSON.parse(localStorage.getItem('draksyon_shown_dialogs') || '[]');
    db.ref('app_messages').orderByChild('active').equalTo(true).on('child_added', function(snap) {
        var key = snap.key;
        if (shownDialogs.indexOf(key) !== -1) return;
        var msg = snap.val();
        if (!msg || !msg.active) return;
        showDialog(msg.title, msg.message, msg.type || 'info', msg.duration || 0, key);
    });

    function showDialog(title, message, type, duration, key) {
        var colors = { info: '#254BFF', warning: '#f59e0b', error: '#ef4444', success: '#22c55e' };
        var icons = { info: 'ℹ️', warning: '⚠️', error: '❌', success: '✅' };
        var color = colors[type] || colors.info;
        var icon = icons[type] || icons.info;

        var overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;inset:0;z-index:99998;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;padding:20px;animation:dkDialogFadeIn .3s ease;';
        var box = document.createElement('div');
        box.style.cssText = 'background:#18181b;border-radius:16px;padding:28px 24px;max-width:380px;width:100%;text-align:center;border:1px solid ' + color + '33;box-shadow:0 20px 60px rgba(0,0,0,0.5);';
        box.innerHTML = '<div style="font-size:36px;margin-bottom:12px;">' + icon + '</div>' +
            '<h3 style="font-size:18px;font-weight:700;color:#fff;margin-bottom:10px;">' + title + '</h3>' +
            '<p style="font-size:14px;color:#9aa0a6;line-height:1.6;margin-bottom:20px;">' + message + '</p>' +
            '<button onclick="this.closest('div[style*=fixed]').remove()" style="background:' + color + ';color:#fff;border:none;padding:10px 30px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;">Entendi</button>';

        var style = document.createElement('style');
        style.textContent = '@keyframes dkDialogFadeIn{from{opacity:0}to{opacity:1}}';
        overlay.appendChild(style);
        overlay.appendChild(box);
        overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });
        document.body.appendChild(overlay);

        shownDialogs.push(key);
        localStorage.setItem('draksyon_shown_dialogs', JSON.stringify(shownDialogs));

        if (duration > 0) {
            setTimeout(function() { if (overlay.parentNode) overlay.remove(); }, duration * 1000);
        }
    }

    // ── Escutar banner ──
    db.ref('app_config/banner').on('value', function(snap) {
        var banner = snap.val();
        var existing = document.getElementById('draksyon-banner');
        if (existing) existing.remove();
        if (!banner || !banner.active) return;

        var div = document.createElement('div');
        div.id = 'draksyon-banner';
        div.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9998;background:' + (banner.color || '#254BFF') + ';color:#fff;text-align:center;padding:8px 40px 8px 16px;font-size:13px;font-weight:600;font-family:-apple-system,sans-serif;';
        div.textContent = banner.text;

        if (banner.link) {
            div.style.cursor = 'pointer';
            div.addEventListener('click', function() { window.open(banner.link, '_blank'); });
        }

        var closeBtn = document.createElement('button');
        closeBtn.textContent = '✕';
        closeBtn.style.cssText = 'position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:#fff;font-size:16px;cursor:pointer;opacity:0.7;';
        closeBtn.addEventListener('click', function(e) { e.stopPropagation(); div.remove(); document.body.style.paddingTop = ''; });
        div.appendChild(closeBtn);

        document.body.insertBefore(div, document.body.firstChild);
        // Adjust body padding
        document.body.style.paddingTop = (parseInt(getComputedStyle(document.body).paddingTop) + div.offsetHeight) + 'px';
    });

    // ── Escutar anúncio popup ──
    var announcementShown = localStorage.getItem('draksyon_announcement_shown');
    db.ref('app_config/announcement').on('value', function(snap) {
        var ann = snap.val();
        if (!ann || !ann.active) return;
        var annKey = ann.created_at || 'default';
        if (announcementShown === annKey) return;

        var overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;inset:0;z-index:99997;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;padding:20px;animation:dkAnnFadeIn .3s ease;';

        var content = '<h2 style="font-size:20px;font-weight:700;color:#fff;margin-bottom:10px;">' + ann.title + '</h2>';
        if (ann.image) content += '<img src="' + ann.image + '" style="width:100%;max-height:200px;object-fit:cover;border-radius:10px;margin-bottom:12px;">';
        content += '<p style="font-size:14px;color:#9aa0a6;line-height:1.6;margin-bottom:20px;">' + ann.message + '</p>';
        content += '<button onclick="this.closest('div[style*=fixed]').remove()" style="background:#254BFF;color:#fff;border:none;padding:12px 30px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;">Fechar</button>';

        var box = document.createElement('div');
        box.style.cssText = 'background:#18181b;border-radius:16px;padding:28px 24px;max-width:420px;width:100%;text-align:center;border:1px solid rgba(37,75,255,0.2);';
        box.innerHTML = content;

        var style = document.createElement('style');
        style.textContent = '@keyframes dkAnnFadeIn{from{opacity:0;transform:scale(0.95)}to{opacity:1;transform:scale(1)}}';
        overlay.appendChild(style);
        overlay.appendChild(box);
        overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });
        document.body.appendChild(overlay);

        localStorage.setItem('draksyon_announcement_shown', annKey);
    });

    // ── Escutar status dos servidores ──
    db.ref('app_config/servers').on('value', function(snap) {
        var servers = snap.val();
        if (!servers) return;
        var currentSrv = localStorage.getItem('draksyon_server_v1') || 's1';
        var srvData = servers[currentSrv];
        if (srvData && srvData.status === 'offline') {
            showDialog('Servidor Indisponível', srvData.message || 'O servidor selecionado está offline. Tente trocar de servidor.', 'error', 0, 'srv_offline_' + Date.now());
        }
    });

    // ── Escutar notificações ──
    var lastNotifCheck = localStorage.getItem('draksyon_last_notif') || '2000-01-01';
    db.ref('notifications').orderByChild('created_at').startAt(lastNotifCheck).on('child_added', function(snap) {
        var notif = snap.val();
        if (!notif || notif.read) return;
        // Show as small toast
        var toast = document.createElement('div');
        toast.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:99996;background:#18181b;border:1px solid rgba(37,75,255,0.3);border-radius:12px;padding:14px 18px;max-width:320px;box-shadow:0 10px 40px rgba(0,0,0,0.5);animation:dkToastIn .3s ease;font-family:-apple-system,sans-serif;';
        toast.innerHTML = '<div style="font-size:13px;font-weight:700;color:#fff;margin-bottom:4px;">🔔 ' + (notif.title || 'Notificação') + '</div>' +
            '<div style="font-size:12px;color:#888;">' + (notif.message || '') + '</div>';

        var style = document.createElement('style');
        style.textContent = '@keyframes dkToastIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}';
        toast.appendChild(style);
        document.body.appendChild(toast);

        setTimeout(function() { if (toast.parentNode) toast.remove(); }, 8000);
        localStorage.setItem('draksyon_last_notif', new Date().toISOString());
    });

    // ── Log de erros ──
    window.addEventListener('error', function(e) {
        db.ref('error_logs').push({
            message: (e.message || '').substr(0, 200),
            page: PAGE_NAME,
            timestamp: new Date().toISOString(),
            url: (e.filename || '').substr(0, 100),
            line: e.lineno || 0
        });
    });

    // ── Verificar versão ──
    db.ref('app_config/version').on('value', function(snap) {
        var ver = snap.val();
        if (!ver || !ver.force_update) return;
        var currentVer = localStorage.getItem('draksyon_app_version');
        if (currentVer === ver.current) return;
        if (ver.update_url) {
            showDialog('Atualização Disponível', 'Uma nova versão (' + ver.current + ') está disponível. Clique para atualizar.', 'info', 0, 'update_' + ver.current);
        }
        localStorage.setItem('draksyon_app_version', ver.current);
    });

    // ── Limpar presença ao sair ──
    window.addEventListener('beforeunload', function() {
        onlineRef.remove();
    });

})();
</script>
